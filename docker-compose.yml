# Every practical, live at once:  docker compose up --build -d
#
#   http://localhost:3000        landing page (links to everything below)
#   http://localhost:3001-3003   Practicals 1-3   (React)
#   http://localhost:3004-3005   Practicals 4-5   (APIs: open /tasks)
#   http://localhost:3006-3013   Practicals 6-13  (apps; their APIs on 5006-5013)
#
# One shared MongoDB; each practical uses its own database (practical5 ... practical13).

name: awdf

x-backend: &backend
  restart: unless-stopped
  depends_on:
    mongodb:
      condition: service_healthy
  networks: [awdf]

x-frontend: &frontend
  restart: unless-stopped
  networks: [awdf]

x-secrets: &secrets
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
  JWT_EXPIRES_IN: 1h

services:
  # ── Shared infrastructure ──────────────────────────────────────────────
  mongodb:
    image: mongo:7
    ports: ["27017:27017"] # lets MongoDB Compass connect from Windows
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [awdf]

  landing:
    image: nginx:1.27-alpine
    ports: ["3000:80"]
    volumes:
      - ./:/usr/share/nginx/html:ro # index.html + READMEs + folders
    configs:
      - source: landing-conf
        target: /etc/nginx/conf.d/default.conf
    restart: unless-stopped
    networks: [awdf]

  # ── Practicals 1-3: React only ─────────────────────────────────────────
  p1:
    <<: *frontend
    build: { context: ./practical-1, dockerfile: ../docker/frontend.Dockerfile }
    ports: ["3001:80"]
  p2:
    <<: *frontend
    build: { context: ./practical-2, dockerfile: ../docker/frontend.Dockerfile }
    ports: ["3002:80"]
  p3:
    <<: *frontend
    build: { context: ./practical-3, dockerfile: ../docker/frontend.Dockerfile }
    ports: ["3003:80"]

  # ── Practicals 4-5: API only ───────────────────────────────────────────
  p4:
    restart: unless-stopped
    networks: [awdf]
    build: { context: ./practical-4, dockerfile: ../docker/backend.Dockerfile }
    ports: ["3004:5000"]
  p5:
    <<: *backend
    build: { context: ./practical-5, dockerfile: ../docker/backend.Dockerfile }
    ports: ["3005:5000"]
    environment: { MONGO_URI: "mongodb://mongodb:27017/practical5" }

  # ── Practicals 6-13: frontend on 30xx, API on 50xx ──────────────────────
  p6-api:
    <<: *backend
    build: { context: ./practical-6/backend, dockerfile: ../../docker/backend.Dockerfile }
    ports: ["5006:5000"]
    environment: { MONGO_URI: "mongodb://mongodb:27017/practical6" }
  p6:
    <<: *frontend
    build:
      context: ./practical-6/frontend
      dockerfile: ../../docker/frontend.Dockerfile
      args: { VITE_API_URL: "http://localhost:5006" }
    ports: ["3006:80"]

  p7-api:
    <<: *backend
    build: { context: ./practical-7/backend, dockerfile: ../../docker/backend.Dockerfile }
    ports: ["5007:5000"]
    environment: { <<: *secrets, MONGO_URI: "mongodb://mongodb:27017/practical7" }
  p7:
    <<: *frontend
    build:
      context: ./practical-7/frontend
      dockerfile: ../../docker/frontend.Dockerfile
      args: { VITE_API_URL: "http://localhost:5007" }
    ports: ["3007:80"]

  p8-api:
    <<: *backend
    build: { context: ./practical-8/backend, dockerfile: ../../docker/backend.Dockerfile }
    ports: ["5008:5000"]
    environment: { <<: *secrets, MONGO_URI: "mongodb://mongodb:27017/practical8" }
  p8:
    <<: *frontend
    build:
      context: ./practical-8/frontend
      dockerfile: ../../docker/frontend.Dockerfile
      args: { VITE_API_URL: "http://localhost:5008" }
    ports: ["3008:80"]

  p9-api:
    <<: *backend
    build: { context: ./practical-9/backend, dockerfile: ../../docker/backend.Dockerfile }
    ports: ["5009:5000"]
    environment: { <<: *secrets, MONGO_URI: "mongodb://mongodb:27017/practical9" }
  p9:
    <<: *frontend
    build:
      context: ./practical-9/frontend
      dockerfile: ../../docker/frontend.Dockerfile
      args: { VITE_API_URL: "http://localhost:5009" }
    ports: ["3009:80"]

  p10-api:
    <<: *backend
    build: { context: ./practical-10/backend, dockerfile: ../../docker/backend.Dockerfile }
    ports: ["5010:5000"]
    environment: { <<: *secrets, MONGO_URI: "mongodb://mongodb:27017/practical10" }
  p10:
    <<: *frontend
    build:
      context: ./practical-10/frontend
      dockerfile: ../../docker/frontend.Dockerfile
      args: { VITE_API_URL: "http://localhost:5010" }
    ports: ["3010:80"]

  p11-api:
    <<: *backend
    build: { context: ./practical-11/backend, dockerfile: ../../docker/backend.Dockerfile }
    ports: ["5011:5000"]
    environment: { <<: *secrets, MONGO_URI: "mongodb://mongodb:27017/practical11" }
  p11:
    <<: *frontend
    build:
      context: ./practical-11/frontend
      dockerfile: ../../docker/frontend.Dockerfile
      args: { VITE_API_URL: "http://localhost:5011" }
    ports: ["3011:80"]

  p12-api:
    <<: *backend
    build: { context: ./practical-12/backend, dockerfile: ../../docker/backend.Dockerfile }
    ports: ["5012:5000"]
    environment: { <<: *secrets, MONGO_URI: "mongodb://mongodb:27017/practical12" }
  p12:
    <<: *frontend
    build:
      context: ./practical-12/frontend
      dockerfile: ../../docker/frontend.Dockerfile
      args: { VITE_API_URL: "http://localhost:5012" }
    ports: ["3012:80"]

  p13-api:
    <<: *backend
    build: { context: ./practical-13/backend, dockerfile: ../../docker/backend.Dockerfile }
    ports: ["5013:5000"]
    environment:
      <<: *secrets
      MONGO_URI: "mongodb://mongodb:27017/practical13"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-} # optional; without it the AI button shows the fallback
  p13:
    <<: *frontend
    build:
      context: ./practical-13/frontend
      dockerfile: ../../docker/frontend.Dockerfile
      args: { VITE_API_URL: "http://localhost:5013" }
    ports: ["3013:80"]

configs:
  landing-conf:
    content: |
      server {
        listen 80;
        root /usr/share/nginx/html;
        charset utf-8;
        location / { autoindex on; }                 # "Open folder" shows the files
        location ~ \.md$ { default_type text/plain; } # READMEs open as text
        location ~ /node_modules/ { return 404; }
      }

networks:
  awdf:

volumes:
  mongo-data:
